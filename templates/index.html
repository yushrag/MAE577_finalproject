<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Microgravity Simulation | MAE 577</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        canvas {
            display: block;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }

        .neo-button {
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.1);
        }

        .neo-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <div id="ui-layer" class="fixed inset-0 pointer-events-none z-10 p-8 flex flex-col justify-between">
        <!-- Header -->
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="glass p-6">
                <h1 class="text-2xl font-bold tracking-tight text-cyan-400">3D Microgravity Sim</h1>
                <p class="text-xs uppercase tracking-widest text-gray-400">MAE 577 | Multi-Robot Systems</p>
            </div>
            <div class="glass p-6">
                <div class="flex gap-4">
                    <div class="text-center">
                        <p class="text-[10px] uppercase text-gray-500">Agents</p>
                        <p id="agent-count" class="text-xl font-mono">0</p>
                    </div>
                    <div class="w-px h-8 bg-white/10"></div>
                    <div class="text-center">
                        <p class="text-[10px] uppercase text-gray-500">Avg Vel</p>
                        <p id="avg-vel" class="text-xl font-mono text-cyan-400">0.00</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex flex-col items-center gap-4 pointer-events-auto w-full max-w-4xl mx-auto">
            <button id="toggle-panel" class="neo-button px-4 py-1 rounded-full text-xs font-bold text-gray-400 hover:text-white uppercase tracking-widest shadow-md border border-white/10 self-center mb-[-1rem] z-20 bg-[#050505]/80 backdrop-blur-md">
                ▼ Hide Controls
            </button>
            <div id="control-panel" class="glass p-4 flex flex-col gap-4 w-full transition-all duration-300 ease-in-out transform origin-bottom">
                <!-- Simulation Controls -->
                <div class="flex gap-4 items-center">
                    <button id="toggle-sim" class="neo-button px-6 py-2 rounded-full font-bold text-sm uppercase">Start
                        Simulation</button>
                    <button id="toggle-record" class="neo-button px-4 py-2 rounded-full text-xs font-bold text-red-400 uppercase border border-red-500/30 transition-colors">Record CSV: OFF</button>
                    <div class="w-px h-6 bg-white/10"></div>
                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between items-center">
                            <label class="text-[10px] uppercase text-gray-500">Air Density (ρ)</label>
                            <span id="rho-val" class="text-[10px] font-mono text-cyan-400">0.05 kg/m³</span>
                        </div>
                        <input id="rho-slider" type="range" min="0" max="2" step="0.01" value="0.05"
                            class="accent-cyan-500 w-20">
                    </div>
                    
                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between items-center">
                            <label class="text-[10px] uppercase text-gray-500">LJ Epsilon (ε)</label>
                            <span id="epsilon-val" class="text-[10px] font-mono text-cyan-400">10.0</span>
                        </div>
                        <input id="epsilon-slider" type="range" min="0" max="50" step="0.5" value="10.0"
                            class="accent-cyan-500 w-20">
                    </div>
                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between items-center">
                            <label class="text-[10px] uppercase text-gray-500">LJ Sigma (σ)</label>
                            <span id="sigma-val" class="text-[10px] font-mono text-cyan-400">10.0</span>
                        </div>
                        <input id="sigma-slider" type="range" min="0.1" max="20" step="0.1" value="10.0"
                            class="accent-cyan-500 w-20">
                    </div>
                    <button id="reset-sim"
                        class="neo-button px-4 py-2 rounded-full text-xs opacity-60 hover:opacity-100">Reset</button>
                </div>

                <!-- Velocity Controls -->
                <div class="flex gap-6 items-center border-t border-white/5 pt-4">
                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between items-center">
                            <label class="text-[10px] uppercase text-cyan-400 font-bold">Target Vx</label>
                            <span id="vx-val" class="text-[10px] font-mono ml-2">0.0 m/s</span>
                        </div>
                        <input id="vx-slider" type="range" min="-10" max="10" step="0.1" value="0"
                            class="accent-cyan-500 w-24">
                    </div>
                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between items-center">
                            <label class="text-[10px] uppercase text-cyan-400 font-bold">Target Vy</label>
                            <span id="vy-val" class="text-[10px] font-mono ml-2">0.0 m/s</span>
                        </div>
                        <input id="vy-slider" type="range" min="-10" max="10" step="0.1" value="0"
                            class="accent-cyan-500 w-24">
                    </div>
                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between items-center">
                            <label class="text-[10px] uppercase text-cyan-400 font-bold">Target Vz</label>
                            <span id="vz-val" class="text-[10px] font-mono ml-2">0.0 m/s</span>
                        </div>
                        <input id="vz-slider" type="range" min="-10" max="10" step="0.1" value="0"
                            class="accent-cyan-500 w-24">
                    </div>

                    <div class="w-px h-10 bg-white/10"></div>

                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between items-center">
                            <label class="text-[10px] uppercase text-orange-400 font-bold">Duration</label>
                            <span id="duration-val" class="text-[10px] font-mono ml-2">2.0s</span>
                        </div>
                        <input id="duration-slider" type="range" min="0.1" max="10" step="0.1" value="2.0"
                            class="accent-orange-500 w-24">
                    </div>

                    <button id="apply-command"
                        class="bg-cyan-500 hover:bg-cyan-400 text-black px-6 py-2 rounded-full font-bold text-xs uppercase transition-all transform hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(6,182,212,0.4)]">Apply
                        Command</button>

                    <button id="zero-vel" class="neo-button px-3 py-1 rounded text-[10px] uppercase">Halt</button>
                </div>

                <!-- Milling Controls -->
                <div class="flex gap-6 items-center border-t border-white/5 pt-4">
                    <button id="toggle-milling" class="neo-button px-6 py-2 rounded-full font-bold text-sm uppercase">Milling: OFF</button>
                    <div class="w-px h-6 bg-white/10"></div>
                    
                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between items-center">
                            <label class="text-[10px] uppercase text-gray-500">FOV Angle (θ)</label>
                            <span id="milling-fov-val" class="text-[10px] font-mono text-cyan-400">30.0°</span>
                        </div>
                        <input id="milling-fov-slider" type="range" min="5" max="180" step="1" value="30"
                            class="accent-cyan-500 w-24">
                    </div>
                    
                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between items-center">
                            <label class="text-[10px] uppercase text-gray-500">Speed</label>
                            <span id="milling-speed-val" class="text-[10px] font-mono text-cyan-400">5.0</span>
                        </div>
                        <input id="milling-speed-slider" type="range" min="0.1" max="20" step="0.1" value="5.0"
                            class="accent-cyan-500 w-24">
                    </div>
                    
                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between items-center">
                            <label class="text-[10px] uppercase text-gray-500">Turn Rate</label>
                            <span id="milling-turn-val" class="text-[10px] font-mono text-cyan-400">5.0</span>
                        </div>
                        <input id="milling-turn-slider" type="range" min="0.1" max="20" step="0.1" value="5.0"
                            class="accent-cyan-500 w-24">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const CONFIG = {
            numAgents: 30,
            boxSize: 40,
            agentRadius: 0.5,
            rho: 0.05,     // Reduced from 1.225 for better drifting
            lj_epsilon: 10.0,
            lj_sigma: 10.0,
            milling_enabled: false,
            milling_fov_angle: 30.0,
            milling_speed: 5.0,
            milling_turn_rate: 5.0,
            Cd: 0.47,
            A: Math.PI * 0.5 * 0.5,
            mass: 1.0,     // Increased from 0.1 for more momentum
            maxThrust: 10,
            gain: 2,
            targetVel: new THREE.Vector3(0, 0, 0),
            duration: 2.0,
            restitution: 1.0,
            microgravity: new THREE.Vector3(0, 0, -0.005) // Z is now Down/Up
        };

        let agents = [];

        // --- Three.js Setup ---
        THREE.Object3D.DefaultUp.set(0, 0, 1); // Set Z as Up globally
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(40, 40, 40);
        controls.update();

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 10, 50);
        scene.add(directionalLight);

        // --- Environment (STL Mesh) ---
        let boundaryMesh = null;

        function loadMeshBoundary() {
            return new Promise((resolve) => {
                const loader = new THREE.OBJLoader();
                // Add timestamp to prevent browser caching of old STL/OBJ files
                const meshUrl = '/static/Tesserae_SimpleShell.obj?v=' + Date.now();
                loader.load(meshUrl, (object) => {
                    // Extract geometry from the first mesh in the OBJ group
                    let geometry = null;
                    object.traverse((child) => {
                        if (child.isMesh && !geometry) {
                            geometry = child.geometry;
                        }
                    });

                    if (!geometry) {
                        console.warn('OBJ loaded but no mesh found.');
                        resolve();
                        return;
                    }

                    // Center the geometry at origin
                    geometry.computeVertexNormals();
                    geometry.computeBoundingBox();
                    const center = new THREE.Vector3();
                    geometry.boundingBox.getCenter(center);
                    geometry.translate(-center.x, -center.y, -center.z);

                    // Scale to match the Python physics engine (box_size = 40)
                    const box3 = new THREE.Box3().setFromBufferAttribute(geometry.attributes.position);
                    const size = new THREE.Vector3();
                    box3.getSize(size);
                    const maxExtent = Math.max(size.x, size.y, size.z);
                    const scale = CONFIG.boxSize / maxExtent;
                    geometry.scale(scale, scale, scale);

                    // Render the exterior surface only (FrontSide = outward-facing faces)
                    // This matches exactly what the physics engine uses as the collision boundary.
                    // Semi-transparent so agents floating inside remain visible.
                    const exteriorMat = new THREE.MeshPhongMaterial({
                        color: 0x0ea5e9,
                        emissive: 0x0369a1,
                        emissiveIntensity: 0.2,
                        transparent: true,
                        opacity: 0.18,
                        side: THREE.FrontSide,
                        depthWrite: false
                    });
                    boundaryMesh = new THREE.Mesh(geometry, exteriorMat);
                    scene.add(boundaryMesh);

                    // Adjust camera
                    camera.position.set(CONFIG.boxSize, CONFIG.boxSize, CONFIG.boxSize);
                    controls.target.set(0, 0, 0);
                    controls.update();

                    console.log(`OBJ Mesh Loaded (Smooth Rendering Active) | Scale: ${scale.toFixed(4)}`);
                    resolve();
                }, undefined, (err) => {
                    console.warn('Mesh load failed, no boundary displayed.', err);
                    resolve();
                });
            });
        }

        function updateEnvironment(size) {
            // Camera adjustment only when server sends new box size
            camera.position.set(size, size, size);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        // --- Agents ---
        class Agent {
            constructor(id) {
                this.id = id;
                this.pos = new THREE.Vector3(0, 0, 0);
                this.targetPos = new THREE.Vector3(0, 0, 0); // For smoothing
                this.vel = new THREE.Vector3(0, 0, 0);

                // Color agents randomly for identification
                const hue = Math.random();
                const geo = new THREE.SphereGeometry(CONFIG.agentRadius, 16, 16);
                const mat = new THREE.MeshPhongMaterial({
                    color: new THREE.Color().setHSL(hue, 0.8, 0.6),
                    emissive: new THREE.Color().setHSL(hue, 0.8, 0.3),
                    emissiveIntensity: 0.5
                });
                this.mesh = new THREE.Mesh(geo, mat);
                scene.add(this.mesh);
            }

            updateFromState(posArray, velArray, immediate = false) {
                this.targetPos.set(posArray[0], posArray[1], posArray[2]);
                this.vel.set(velArray[0], velArray[1], velArray[2]);
                if (immediate) {
                    this.pos.copy(this.targetPos);
                    this.mesh.position.copy(this.pos);
                }
            }

            interpolate(factor) {
                // Smoothly move current position towards target position
                this.pos.lerp(this.targetPos, factor);
                this.mesh.position.copy(this.pos);
            }
        }

        async function initSimulation() {
            console.log("Initializing simulation...");

            // Load Mesh boundary first so it's ready before agents appear
            await loadMeshBoundary();

            try {
                const response = await fetch('/api/config');
                const serverConfig = await response.json();
                console.log("Received config from server:", serverConfig);

                // Update configuration from server
                if (serverConfig.num_agents) CONFIG.numAgents = serverConfig.num_agents;
                if (serverConfig.box_size) CONFIG.boxSize = serverConfig.box_size;
                if (serverConfig.lj_epsilon !== undefined) {
                    CONFIG.lj_epsilon = serverConfig.lj_epsilon;
                    document.getElementById('epsilon-slider').value = CONFIG.lj_epsilon;
                    document.getElementById('epsilon-val').innerText = CONFIG.lj_epsilon.toFixed(1);
                }
                if (serverConfig.lj_sigma !== undefined) {
                    CONFIG.lj_sigma = serverConfig.lj_sigma;
                    document.getElementById('sigma-slider').value = CONFIG.lj_sigma;
                    document.getElementById('sigma-val').innerText = CONFIG.lj_sigma.toFixed(1);
                }
                if (serverConfig.milling_enabled !== undefined) {
                    CONFIG.milling_enabled = serverConfig.milling_enabled;
                    document.getElementById('toggle-milling').innerText = CONFIG.milling_enabled ? 'Milling: ON' : 'Milling: OFF';
                    if (CONFIG.milling_enabled) document.getElementById('toggle-milling').classList.add('bg-cyan-500/20');
                }
                if (serverConfig.milling_fov_angle !== undefined) {
                    CONFIG.milling_fov_angle = serverConfig.milling_fov_angle;
                    document.getElementById('milling-fov-slider').value = CONFIG.milling_fov_angle;
                    document.getElementById('milling-fov-val').innerText = CONFIG.milling_fov_angle.toFixed(1) + '°';
                }
                if (serverConfig.milling_speed !== undefined) {
                    CONFIG.milling_speed = serverConfig.milling_speed;
                    document.getElementById('milling-speed-slider').value = CONFIG.milling_speed;
                    document.getElementById('milling-speed-val').innerText = CONFIG.milling_speed.toFixed(1);
                }
                if (serverConfig.milling_turn_rate !== undefined) {
                    CONFIG.milling_turn_rate = serverConfig.milling_turn_rate;
                    document.getElementById('milling-turn-slider').value = CONFIG.milling_turn_rate;
                    document.getElementById('milling-turn-val').innerText = CONFIG.milling_turn_rate.toFixed(1);
                }

            } catch (error) {
                console.warn("Could not fetch config from server, using defaults.", error);
            }

            // Create agents
            agents = [];
            for (let i = 0; i < CONFIG.numAgents; i++) {
                agents.push(new Agent(i));
            }
            document.getElementById('agent-count').innerText = agents.length;
            
            // Start the animation loop if it hasn't started
            if (!animationStarted) {
                animationStarted = true;
                animate();
            }

            // Fetch initial state once
            try {
                const response = await fetch('/api/step', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dt: 0 })
                });
                const state = await response.json();
                state.positions.forEach((pos, i) => {
                    if (agents[i]) agents[i].updateFromState(pos, state.velocities[i], true);
                });
            } catch (e) {
                console.error("Failed to fetch initial state:", e);
            }
        }

        let animationStarted = false;

        // --- Main Loop ---
        let running = false;
        let lastTime = performance.now();
        let isFetching = false;

        async function fetchState() {
            if (!running || isFetching) return;
            isFetching = true;

            try {
                const payload = { 
                    dt: 0.016, 
                    rho: CONFIG.rho, 
                    lj_epsilon: CONFIG.lj_epsilon, 
                    lj_sigma: CONFIG.lj_sigma,
                    milling_enabled: CONFIG.milling_enabled,
                    milling_fov_angle: CONFIG.milling_fov_angle,
                    milling_speed: CONFIG.milling_speed,
                    milling_turn_rate: CONFIG.milling_turn_rate
                };
                const response = await fetch('/api/step', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const state = await response.json();
                
                state.positions.forEach((pos, i) => {
                    if (agents[i]) {
                        agents[i].updateFromState(pos, state.velocities[i]);
                    }
                });
                document.getElementById('avg-vel').innerText = state.avg_vel.toFixed(2);
            } catch (e) {
                console.error("Failed to fetch simulation step:", e);
            } finally {
                isFetching = false;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // 1. Fetch new state if not already fetching
            if (running) {
                fetchState();
            }

            // 2. Interpolate all agents (smooth 60fps motion)
            // A factor of 0.1 - 0.2 provides a good balance of smoothness vs lag
            const lerpFactor = 0.15; 
            agents.forEach(agent => agent.interpolate(lerpFactor));

            renderer.render(scene, camera);
        }

        initSimulation();

        // --- Controls UI ---
        document.getElementById('toggle-sim').addEventListener('click', async (e) => {
            running = !running;
            e.target.innerText = running ? 'Stop Simulation' : 'Start Simulation';
            e.target.classList.toggle('bg-cyan-500/20');
        });

        let isRecording = false;
        document.getElementById('toggle-record').addEventListener('click', async (e) => {
            isRecording = !isRecording;
            
            if (isRecording) {
                e.target.innerText = 'Recording CSV...';
                e.target.classList.add('bg-red-500/20');
                e.target.classList.remove('text-red-400');
                e.target.classList.add('text-red-300');
            } else {
                e.target.innerText = 'Record CSV: OFF';
                e.target.classList.remove('bg-red-500/20');
                e.target.classList.add('text-red-400');
                e.target.classList.remove('text-red-300');
            }
            
            // Toggle CSV Recording on backend
            try {
                await fetch('/api/toggle_recording', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ record: isRecording })
                });
            } catch (err) {
                console.error("Failed to toggle recording", err);
            }
        });

        document.getElementById('reset-sim').addEventListener('click', async () => {
            await fetch('/api/reset', { method: 'POST' });
        });

        document.getElementById('rho-slider').addEventListener('input', (e) => {
            CONFIG.rho = parseFloat(e.target.value);
            document.getElementById('rho-val').innerText = `${CONFIG.rho.toFixed(2)} kg/m³`;
        });

        document.getElementById('epsilon-slider').addEventListener('input', (e) => {
            CONFIG.lj_epsilon = parseFloat(e.target.value);
            document.getElementById('epsilon-val').innerText = CONFIG.lj_epsilon.toFixed(1);
        });

        document.getElementById('sigma-slider').addEventListener('input', (e) => {
            CONFIG.lj_sigma = parseFloat(e.target.value);
            document.getElementById('sigma-val').innerText = CONFIG.lj_sigma.toFixed(1);
        });

        // Milling UI Events
        document.getElementById('toggle-milling').addEventListener('click', (e) => {
            CONFIG.milling_enabled = !CONFIG.milling_enabled;
            e.target.innerText = CONFIG.milling_enabled ? 'Milling: ON' : 'Milling: OFF';
            e.target.classList.toggle('bg-cyan-500/20');
        });

        document.getElementById('milling-fov-slider').addEventListener('input', (e) => {
            CONFIG.milling_fov_angle = parseFloat(e.target.value);
            document.getElementById('milling-fov-val').innerText = CONFIG.milling_fov_angle.toFixed(1) + '°';
        });

        document.getElementById('milling-speed-slider').addEventListener('input', (e) => {
            CONFIG.milling_speed = parseFloat(e.target.value);
            document.getElementById('milling-speed-val').innerText = CONFIG.milling_speed.toFixed(1);
        });

        document.getElementById('milling-turn-slider').addEventListener('input', (e) => {
            CONFIG.milling_turn_rate = parseFloat(e.target.value);
            document.getElementById('milling-turn-val').innerText = CONFIG.milling_turn_rate.toFixed(1);
        });

        document.getElementById('vx-slider').addEventListener('input', (e) => {
            CONFIG.targetVel.x = parseFloat(e.target.value);
            document.getElementById('vx-val').innerText = `${CONFIG.targetVel.x.toFixed(1)} m/s`;
        });
        document.getElementById('vy-slider').addEventListener('input', (e) => {
            CONFIG.targetVel.y = parseFloat(e.target.value);
            document.getElementById('vy-val').innerText = `${CONFIG.targetVel.y.toFixed(1)} m/s`;
        });
        document.getElementById('vz-slider').addEventListener('input', (e) => {
            CONFIG.targetVel.z = parseFloat(e.target.value);
            document.getElementById('vz-val').innerText = `${CONFIG.targetVel.z.toFixed(1)} m/s`;
        });
        document.getElementById('zero-vel').addEventListener('click', () => {
            CONFIG.targetVel.set(0, 0, 0);
            document.getElementById('vx-slider').value = 0;
            document.getElementById('vy-slider').value = 0;
            document.getElementById('vz-slider').value = 0;
            document.getElementById('vx-val').innerText = '0.0 m/s';
            document.getElementById('vy-val').innerText = '0.0 m/s';
            document.getElementById('vz-val').innerText = '0.0 m/s';
            // Also stop any active commands
            agents.forEach(a => a.commandTimer = 0);
        });

        document.getElementById('duration-slider').addEventListener('input', (e) => {
            CONFIG.duration = parseFloat(e.target.value);
            document.getElementById('duration-val').innerText = `${CONFIG.duration.toFixed(1)}s`;
        });

        document.getElementById('apply-command').addEventListener('click', async () => {
            await fetch('/api/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    target_vel: [CONFIG.targetVel.x, CONFIG.targetVel.y, CONFIG.targetVel.z],
                    duration: CONFIG.duration
                })
            });
        });

        // --- Panel Toggle UI ---
        const panelToggleBtn = document.getElementById('toggle-panel');
        const controlPanel = document.getElementById('control-panel');
        let panelVisible = true;
        
        panelToggleBtn.addEventListener('click', () => {
            panelVisible = !panelVisible;
            if (panelVisible) {
                controlPanel.style.opacity = '1';
                controlPanel.style.transform = 'translateY(0) scaleY(1)';
                controlPanel.style.pointerEvents = 'auto';
                controlPanel.style.height = 'auto';
                panelToggleBtn.innerText = '▼ Hide Controls';
            } else {
                controlPanel.style.opacity = '0';
                controlPanel.style.transform = 'translateY(20px) scaleY(0.9)';
                controlPanel.style.pointerEvents = 'none';
                controlPanel.style.height = '0px';
                controlPanel.style.overflow = 'hidden';
                panelToggleBtn.innerText = '▲ Show Controls';
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
